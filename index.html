<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Benvenuto</title>

    <!-- CONTROLLORE BROWSER: GESTISCE IL PRIMO ACCESSO O IL RITORNO AL MENU -->
    <script>
        (function() {
            var userLang = (navigator.language || navigator.userLanguage || 'it').substring(0, 2).toLowerCase();
            var lingueSupportate = ['it', 'en', 'de', 'fr', 'es'];
            var linguaDestinazione = lingueSupportate.includes(userLang) ? userLang.toUpperCase() : 'IT';

            if (localStorage.getItem('eatmefirst_consent') === 'accepted') {
                // Utente già registrato: va dritto al menu della sua lingua
                window.location.href = linguaDestinazione + '/menu.html';
            } else {
                // Primo accesso: mostra la clip d'intro multilingua e video
                window.location.href = linguaDestinazione + '/intro.html';
            }
        })();
    </script>
</head>
<body>
    <!-- Pagina di transito invisibile: reindirizza istantaneamente alla cartella della lingua -->
</body>
</html>
