<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Bienvenido</title>
    <style>
        :root {
            --bg-color: #12181b;
            --primary-color: #2ecc71;
            --text-color: #e0e6ed;
            --border-color: #2d3748;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Letras multilingüe flotantes */
        .welcome-text {
            position: absolute;
            font-weight: bold;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* 1. Benvenuto (Italiano) - Desde Arriba */
        .it {
            font-size: 3.5rem;
            color: var(--primary-color);
            animation: slideFromTop 2.5s ease-out 0.3s forwards, fadeOut 1.5s ease-in 5.5s forwards;
        }

        /* 2. Welcome (Inglés) - Desde la Izquierda */
        .en {
            font-size: 2.5rem;
            color: #3182ce;
            top: 25%;
            left: 10%;
            animation: slideFromLeft 2.5s ease-out 1s forwards, fadeOut 1.5s ease-in 5.5s forwards;
        }

        /* 3. Willkommen (Alemán) - Desde la Derecha */
        .de {
            font-size: 2.5rem;
            color: #e53e3e;
            top: 30%;
            right: 10%;
            animation: slideFromRight 2.5s ease-out 1.8s forwards, fadeOut 1.5s ease-in 5.5s forwards;
        }

        /* 4. Bienvenue (Francés) - Abajo Izquierda */
        .fr {
            font-size: 2.2rem;
            color: #ecc94b;
            bottom: 25%;
            left: 15%;
            animation: slideFromBottom 2.5s ease-out 2.5s forwards, fadeOut 1.5s ease-in 5.5s forwards;
        }

        /* 5. Bienvenido (Español) - Abajo Derecha */
        .es {
            font-size: 2.2rem;
            color: #9f7aea;
            bottom: 20%;
            right: 15%;
            animation: slideFromBottom 2.5s ease-out 3.2s forwards, fadeOut 1.5s ease-in 5.5s forwards;
        }

        /* Animaciones Keyframes */
        @keyframes slideFromTop {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(-40px); opacity: 1; }
        }

        @keyframes slideFromLeft {
            0% { transform: translateX(-150px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0.85; }
        }

        @keyframes slideFromRight {
            0% { transform: translateX(150px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0.85; }
        }

        @keyframes slideFromBottom {
            0% { transform: translateY(150px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0.85; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Reproductor de Video Integrado */
        #videoContainer {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Animación Multilingüe (Duración total: ~6.5 segundos) -->
    <div id="welcomeStage" class="welcome-stage">
        <div class="welcome-text it">Benvenuto</div>
        <div class="welcome-text en">Welcome</div>
        <div class="welcome-text de">Willkommen</div>
        <div class="welcome-text fr">Bienvenue</div>
        <div class="welcome-text es">Bienvenido</div>
    </div>

    <!-- Contenedor del Clip de Video -->
    <div id="videoContainer">
        <video id="siglaVideo" muted playsinline>
            <source src="../IMG/sigla.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const welcomeStage = document.getElementById('welcomeStage');
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('siglaVideo');

        // Después de 6.5 segundos de animación de los textos:
        setTimeout(() => {
            welcomeStage.style.display = 'none';
            videoContainer.style.display = 'flex';

            // Configura la velocidad de reproducción ralentizada para que el video dure unos 6-7 segundos
            video.playbackRate = 0.65; 
            
            video.play().catch(err => {
                // Si falla el autoplay o termina el video, va directo a benvenuto.html
                window.location.href = 'benvenuto.html';
            });
        }, 6500);

        // Cuando el clip de video termina, pasa a la página de bienvenida de Max y Eva
        video.addEventListener('ended', () => {
            window.location.href = 'benvenuto.html';
        });

        // También permitimos hacer clic para omitir la introducción en cualquier momento
        document.body.addEventListener('click', () => {
            window.location.href = 'benvenuto.html';
        });
    </script>
</body>
</html>
